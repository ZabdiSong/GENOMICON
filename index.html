(function (root) {
  'use strict';
  const normalize = pair => pair.split('').sort().join('');

  const flowerOptions = ['AABB','AABb','AAbb','AaBB','AaBb','Aabb','aaBB','aaBb','aabb'];

  function monoCross(p1,p2) {

    for (let row=0;row<2;row++) for (let col=0;col<2;col++) {
      const genotype = normalize(p1[col] + p2[row]); counts[genotype]++;

    const cross = monoCross(p1,p2);
    return cross.cells[Math.min(3, Math.floor(Math.max(0,rng()) * 4))];
  }
  function gametes(parent) {
    if (!flowerOptions.includes(parent)) throw new Error('Choose a two-gene genotype.');

  function renderGuide(){
    const g=S.guide,complement={A:'T',T:'A',C:'G',G:'C'},terms=C.terms.filter(t=>(g.group==='All'||t.group===g.group)&&(!g.query||(t.name+' '+t.text).toLowerCase().includes(g.query.toLowerCase())));
    setMain('<div class="lab-heading"><div><button class="back-link" data-room="home">'+icon('back')+' All missions</button><h1>Your field guide</h1><p>Try an idea. Name what you notice. Come back whenever you need a clue.</p></div><span class="science-chip"><i></i>'+C.terms.length+' IDEAS TO EXPLORE</span></div><section class="guide-top"><div class="panel panel-inner"><h2>A base has a partner.</h2><p>Choose a DNA base and watch the complementary pair appear.</p><div class="base-builder"><div class="base-choice-group">'+['A','T','C','G'].map(b=>'<button class="'+(g.base===b?'selected':'')+'" data-action="guide-base" data-value="'+b+'" aria-pressed="'+(g.base===b)+'">'+b+'</button>').join('')+'</div><div class="base-pair-visual"><span class="base">'+g.base+'</span><span class="bond-lines">'+(['A','T'].includes(g.base)?'=':'≡')+'</span><span class="base partner">'+complement[g.base]+'</span></div></div><p>A–T pairs have two hydrogen bonds; C–G pairs have three. The picture is a conceptual symbol, not a molecular scale drawing.</p></div><div class="panel panel-inner"><h2>Same DNA. Different expression.</h2><p>Change the cell context in this simplified regulatory example.</p><div class="expression-selector">'+['A','B'].map(c=>'<button class="'+(g.cell===c?'selected':'')+'" data-action="guide-cell" data-value="'+c+'" aria-pressed="'+(g.cell===c)+'">Cell '+c+'</button>').join('')+'</div><div class="gene-lanes">'+[1,2,3].map(i=>{const on=i===3||i===(g.cell==='A'?1:2);return '<div class="gene-lane '+(on?'on':'')+'"><span>Gene '+i+'</span><div class="gene-line"></div><span class="gene-status">'+(on?'expressed':'quiet')+'</span></div>';}).join('')+'</div><p style="margin-top:14px">Different regulatory factors change which genes are expressed. Gene 3 stays active in both example cells.</p></div></section><div class="guide-toolbar"><input class="guide-search" id="guide-search" type="search" placeholder="Find a concept…" aria-label="Search genetics concepts" value="'+esc(g.query)+'"><div class="guide-filters">'+['All','Code','Inheritance','Engineering','Expression'].map(group=>'<button class="'+(group===g.group?'selected':'')+'" data-action="guide-group" data-value="'+group+'" aria-pressed="'+(group===g.group)+'">'+group+'</button>').join('')+'</div></div><section class="term-grid" id="term-grid" aria-label="Genetics concepts">'+termCards(terms)+'</section><details class="guide-sources"><summary>Explore the science behind the models</summary><p>All three missions use simplified teaching models. These references explain the wider biology.</p><div class="source-links">'+C.references.map(r=>'<a href="'+r.url+'" target="_blank" rel="noopener noreferrer">'+r.title+' · '+r.org+' ↗</a>').join('')+'</div></details>');
  }
  function termCards(terms){return terms.length?terms.map(t=>'<article class="term-card"><small>'+t.group+'</small><h3>'+t.name+'</h3><p>'+t.text+'</p></article>').join(''):'<div class="empty-state">No concept matches that search. Try another word.</div>';}
  function renderCollection(){
    const badges=E.badges(S.progress);
    setMain('<div class="lab-heading"><div><button class="back-link" data-room="home">'+icon('back')+' All missions</button><h1>Your discoveries, collected.</h1><p>Your original GENOMICON badges, earned through experiments instead of ticked checkboxes.</p></div><span class="science-chip"><i></i>'+badges.filter(Boolean).length+' / 3 EARNED</span></div><section class="badge-grid">'+C.missions.map((m,i)=>'<article class="badge-card '+(badges[i]?'earned':'')+'"><img src="'+m.badgePath+'" alt="'+m.badge+' badge" draggable="false"><h2>'+m.badge+'</h2><p>'+['Predict a cross, build a 1:1 outcome and sample a generation.','Match the DNA, seal the plasmid and follow expression.','Grow the outcomes and solve both two-gene challenges.'][i]+'</p><span class="badge-label">'+(badges[i]?'✓ EARNED':'A DISCOVERY WAITING FOR YOU')+'</span><div style="margin-top:15px">'+btn('collection-open',badges[i]?'Play again':'Explore mission','small '+(badges[i]?'outline':''),'data-room-target="'+m.id+'"')+'</div></article>').join('')+'</section><p class="collection-note">Your discoveries stay on this device. No account needed.</p><div class="bottom-note"><button data-room="guide">Keep your field guide close →</button><button data-action="reset-progress">Reset earned badges</button></div>');
  }

  function setMain(html){
    const active=document.activeElement,remember=active&&main.contains(active)?{id:active.id,tag:active.tagName,data:{...active.dataset},selection:typeof active.selectionStart==='number'?active.selectionStart:null}:null;
    main.innerHTML=html;
    if(remember){const candidate=Array.from(main.querySelectorAll('button,input,select')).find(el=>remember.id?el.id===remember.id:el.tagName===remember.tag&&Object.keys(remember.data).length&&Object.entries(remember.data).every(([k,v])=>el.dataset[k]===v));
      if(candidate){candidate.focus({preventScroll:true});if(remember.selection!==null&&typeof candidate.setSelectionRange==='function'&&['text','search'].includes(candidate.type)){try{candidate.setSelectionRange(remember.selection,remember.selection);}catch(e){}}}
    }
  }
  function chooseEdit(action,value){if(S.busy)return;const result=E.editAction(S.edit,action,value);S.editFeedback=result.message;S.editTone=result.ok?'':'error';renderEditing();tone(result.ok?'tap':'error');}
  function resetBird(key,value){if(!['p1','p2'].includes(key)||!E.monoOptions.includes(value))return;job++;S.busy=false;S.bird[key]=value;Object.assign(S.bird,{prediction:null,revealed:[false,false,false,false],fresh:-1,feedback:'A new cross. Predict the chance of a coral chick, then combine the alleles.',tone:'',samples:[],counts:{blue:0,coral:0}});renderBirds();}
  async function action(name,el){
    if(name==='start'||name==='collection-open'){go(el.dataset.roomTarget);return;}
    if(name==='bird-parent'){resetBird(el.dataset.parent,el.dataset.value);return;}
    if(name==='bird-predict'){S.bird.prediction=Number(el.dataset.value);S.bird.feedback='Prediction set: '+S.bird.prediction+'% coral. Combine the alleles to test your idea.';S.bird.tone='';evaluateBird();renderBirds();tone();return;}
    if(name==='bird-reveal'){if(!S.busy){const token=job;S.busy=true;await revealBird(Number(el.dataset.index));if(token===job&&S.room==='birds'){S.busy=false;renderBirds();}}return;}
    if(name==='bird-animate'){await animateCross();return;}
    if(name==='bird-sample-one'){await sampleBirds(1);return;}
    if(name==='bird-sample-hundred'){await sampleBirds(100);return;}
    if(name==='edit-enzyme'){chooseEdit('enzyme',el.dataset.value);return;}
    if(name==='edit-fragment'){chooseEdit('fragment',el.dataset.value);return;}
    if(name==='edit-tool'){chooseEdit('tool',el.dataset.value);return;}
    if(name==='edit-insert'){await performEdit('insert');return;}
    if(name==='edit-deliver'){await performEdit('deliver');return;}
    if(name==='edit-primary'){
      if(S.busy)return;
      if(S.edit.stage===5){S.edit=E.newEdit();S.editFeedback='A fresh plasmid. Can you build it again?';S.editTone='';renderEditing();return;}
      await performEdit(['cut','insert','seal','deliver','express'][S.edit.stage]);return;
    }
    if(name==='flower-grow'){if(!S.busy)growFlower(Number(el.dataset.index));return;}
    if(name==='flower-grow-all'){await growAllFlowers();return;}
    if(name==='flower-scenario'||name==='flower-dihybrid'||name==='flower-testcross'){
      const scenario=name==='flower-dihybrid'?'dihybrid':name==='flower-testcross'?'testcross':el.dataset.value;
      if(scenario==='dihybrid')resetFlower('AaBb','AaBb');else if(scenario==='testcross')resetFlower('AaBb','aabb');else resetFlower('AaBB','aaBB');return;
    }
    if(name==='flower-hint'){S.flower.hint=!S.flower.hint;renderFlowers();return;}
    if(name==='open-engineering-guide'){S.guide.group='Engineering';go('guide');return;}
    if(name==='guide-base'){S.guide.base=el.dataset.value;renderGuide();tone();return;}
    if(name==='guide-cell'){S.guide.cell=el.dataset.value;renderGuide();tone();return;}
    if(name==='guide-group'){S.guide.group=el.dataset.value;renderGuide();return;}
    if(name==='reset-progress'){S.progress=E.freshProgress();persist();header();renderCollection();toast('Earned badges reset. Your experiments are ready to explore again.');return;}
  }
  document.addEventListener('click',event=>{
    const b=event.target.closest('button');if(!b||b.disabled)return;
    if(b.dataset.room){go(b.dataset.room);return;}
    if(b.dataset.action)action(b.dataset.action,b).catch(()=>{S.busy=false;toast('That action was interrupted. You can try it again.');});
  });
  document.addEventListener('change',event=>{
    if(event.target.dataset.flowerParent){const key=event.target.dataset.flowerParent,value=event.target.value;if(E.flowerOptions.includes(value))resetFlower(key==='p1'?value:S.flower.p1,key==='p2'?value:S.flower.p2);}
  });
  document.addEventListener('input',event=>{
    const el=event.target;
    if(el.dataset.ratio!==undefined){S.flower.values[Number(el.dataset.ratio)]=el.value;return;}
    if(el.id==='guide-search'){S.guide.query=el.value;const g=S.guide;$('#term-grid').innerHTML=termCards(C.terms.filter(t=>(g.group==='All'||t.group===g.group)&&(!g.query||(t.name+' '+t.text).toLowerCase().includes(g.query.toLowerCase()))));}
  });
  document.addEventListener('submit',event=>{if(event.target.id==='ratio-form'){event.preventDefault();checkFlower();}});
  document.addEventListener('dragstart',event=>{
    const node=event.target.closest('[data-drag]');if(!node||S.busy)return;
    event.dataTransfer.setData('text/plain',node.dataset.drag);event.dataTransfer.effectAllowed='move';
  });
  document.addEventListener('dragover',event=>{const target=event.target.closest('[data-drop]');if(target&&!S.busy){event.preventDefault();target.classList.add('dragover');event.dataTransfer.dropEffect='move';}});
  document.addEventListener('dragleave',event=>{const target=event.target.closest('[data-drop]');if(target)target.classList.remove('dragover');});
  document.addEventListener('drop',async event=>{
    const target=event.target.closest('[data-drop]');if(!target)return;event.preventDefault();target.classList.remove('dragover');if(S.busy)return;
    const cargo=event.dataTransfer.getData('text/plain');
    if(target.dataset.drop==='insert'&&['insulin-match','insulin-mismatch','other-gene'].includes(cargo)){E.editAction(S.edit,'fragment',cargo);await performEdit('insert');}
    else if(target.dataset.drop==='bacterium'&&cargo==='plasmid')await performEdit('deliver');
  });
  $('#sound-toggle').innerHTML=icon('sound');$('#motion-toggle').innerHTML=icon('motion');
  $('#sound-toggle').addEventListener('click',()=>{S.sound=!S.sound;header();tone('success');});
  $('#motion-toggle').addEventListener('click',()=>{S.motion=!S.motion;persist();cancelAnimationFrame(heroFrame);header();if(S.room==='home')animateDNA();});
  $('#reward-close').addEventListener('click',()=>{const d=$('#reward-dialog');if(typeof d.close==='function')d.close();else d.removeAttribute('open');});
  $('#reward-next').addEventListener('click',()=>{const d=$('#reward-dialog'),room=$('#reward-next').dataset.nextRoom;if(typeof d.close==='function')d.close();else d.removeAttribute('open');go(room);});
  window.addEventListener('pagehide',()=>{job++;cancelAnimationFrame(heroFrame);});
  // Expose model state through a small, read-only snapshot for debugging this
  // open-source teaching game; all player interaction remains in the UI.
  globalThis.Genomicon={snapshot:()=>JSON.parse(JSON.stringify(S))};
  render();
})();

</script>
</body>
</html>
